<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — Verdant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<main><section id="root"><p class="empty">Loading…</p></section></main>
<script src="app.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get("id");
  const root = $("#root");
  try {
    const p = await api("/api/products/" + encodeURIComponent(id), { auth: false });
    document.title = (p.name || p.title) + " — Verdant";
    let q = 1;
    root.innerHTML = `
      <p class="crumb"><a href="index.html">Home</a> / ${esc(p.name || p.title)}</p>
      <div class="product">
        <figure>${img(p.image || p.imageUrl, p.name)}</figure>
        <div>
          <small>${esc(p.category || "")}</small>
          <h1>${esc(p.name || p.title)}</h1>
          <p class="price">${money(p.price)}</p>
          <p>${esc(p.description || "")}</p>
          <div class="buy">
            <div class="qty"><button id="m" aria-label="Less">−</button><output id="q">1</output><button id="pl" aria-label="More">+</button></div>
            <button class="btn" id="add">Add to cart</button>
          </div>
          <p class="msg" id="msg" role="status"></p>
        </div>
      </div>`;
    $("#m").onclick = () => $("#q").textContent = q = Math.max(1, q - 1);
    $("#pl").onclick = () => $("#q").textContent = ++q;
    $("#add").onclick = async () => {
      if (!token()) return location.href = "login.html?next=" + encodeURIComponent("product.html?id=" + id);
      try {
        await api("/api/cart", { method: "POST", body: { productId: p.id ?? id, quantity: q } });
        $("#msg").className = "msg ok"; $("#msg").textContent = "Added to your cart.";
        $("#count").textContent = Number($("#count").textContent) + q;
      } catch (err) { $("#msg").className = "msg"; $("#msg").textContent = err.message; }
    };
  } catch (err) { root.innerHTML = `<p class="empty">${esc(err.message)}. <a href="index.html">Back to shop</a></p>`; }
})();
</script>
</body>
</html>
