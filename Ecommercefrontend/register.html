<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — Verdant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
    <main>

        <section class="auth">
            <div>
                <h1>Create your account</h1>
                <p>It takes a minute, then you can start shopping.</p>

                <form id="register-form">
                    <div class="field">
                        <label for="fullName">Full name</label>
                        <input id="fullName" name="fullName" type="text" autocomplete="name" required>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                        <small>
                            At least 8 characters, with upper-case, lower-case and a digit. [CONFIRM: your Identity
                            options]
                        </small>
                    </div>
                    <div class="field">
                        <label for="confirm">Confirm password</label>
                        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
                    </div>
                    <div class="msg" id="form-error" role="alert" hidden></div>

                    <button class="btn" type="submit">CREATE ACCOUNT</button>
                </form>

                <p class="alt">
                    Already registered? <a href="login.html">Sign in</a>
                </p>
            </div>
        </section>

    </main>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/scripts.js"></script>
 
</body>
</html>
